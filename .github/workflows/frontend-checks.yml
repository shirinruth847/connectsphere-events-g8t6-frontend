name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-and-journeys:
    name: UI and journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: connectsphere-g8t6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connectsphere-g8t6/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chrome
      - name: Build and check UI journeys
        run: npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            connectsphere-g8t6/playwright-report/
            connectsphere-g8t6/test-results/
          retention-days: 7
